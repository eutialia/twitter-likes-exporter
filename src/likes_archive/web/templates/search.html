{% extends "base.html" %}
{% block content %}
{% if not tweets %}
<div class="empty">
  <p class="empty_title">Nothing matched &ldquo;{{ q }}&rdquo;</p>
  <p class="empty_hint">Try fewer or different words.</p>
</div>
{% else %}
<div class="tweet_list">
  {% include "fragments/tweet_grid.html" %}
</div>
{% endif %}
{% endblock %}
