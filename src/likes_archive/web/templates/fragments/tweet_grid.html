{% from "macros/tweet.html" import tweet_card %}
{% for tweet in tweets %}{{ tweet_card(tweet) }}{% endfor %}
{% if next_cursor and next_page_url %}
<div
  class="feed_sentinel"
  hx-get="{{ next_page_url }}"
  hx-trigger="revealed"
  hx-swap="outerHTML"
  hx-sync="this:replace">
  <span class="feed_sentinel_label">Loading more&hellip;</span>
</div>
{% endif %}
