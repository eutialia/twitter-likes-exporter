[project]
name = "likes-archive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.4",
    "typer>=0.12",
    "tzlocal>=5.2",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "ty>=0.0.1a5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "respx>=0.21",
]

[project.scripts]
likes-archive = "likes_archive.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likes_archive"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
